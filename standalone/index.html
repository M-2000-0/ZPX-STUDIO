<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZPX Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --surface2: #111111;
      --border: #1a1a1a;
      --text: #ffffff;
      --text2: #888888;
      --accent: #ffffff;
      --glass: rgba(255,255,255,0.03);
      --glass-border: rgba(255,255,255,0.08);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    [data-theme="white"] {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --surface2: #eeeeee;
      --border: #e0e0e0;
      --text: #000000;
      --text2: #666666;
      --accent: #000000;
      --glass: rgba(255,255,255,0.6);
      --glass-border: rgba(0,0,0,0.1);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    [data-theme="glass"] {
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.03);
      --surface2: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --text2: #666666;
      --accent: #ffffff;
      --glass: rgba(255,255,255,0.05);
      --glass-border: rgba(255,255,255,0.1);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Liquid Glass Effect */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .titlebar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }

    .titlebar-center {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .theme-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .theme-btn:hover { transform: scale(1.2); }
    .theme-btn.black { background: #000; }
    .theme-btn.white { background: #fff; }
    .theme-btn.glass { background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1)); }

    .main { display: flex; height: calc(100vh - 28px); }

    .sidebar {
      width: 200px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 8px 10px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
    .file-tree { list-style: none; }
    .file-tree li {
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 2px;
      font-size: 12px;
      color: var(--text2);
      transition: all 0.15s;
    }
    .file-tree li:hover { background: var(--glass); color: var(--text); }
    .file-tree li.active { background: var(--accent); color: var(--bg); }

    .center { flex: 1; display: flex; flex-direction: column; }

    .toolbar {
      display: flex;
      gap: 4px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .btn {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
      font-size: 11px;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--surface2); transform: translateY(-1px); }
    .btn.run { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn.run:hover { opacity: 0.9; }
    .btn.stop { background: var(--text); color: var(--bg); }
    .btn.ai { background: var(--glass); border: 1px solid var(--accent); }
    .sep { width: 1px; height: 18px; background: var(--border); }

    .viewport-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .viewport-tab {
      padding: 6px 14px;
      cursor: pointer;
      font-size: 11px;
      color: var(--text2);
      border-right: 1px solid var(--border);
      transition: all 0.15s;
    }
    .viewport-tab:hover { color: var(--text); background: var(--glass); }
    .viewport-tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }

    .viewport-area { flex: 1; position: relative; overflow: hidden; }
    .viewport-panel { position: absolute; inset: 0; display: none; }
    .viewport-panel.active { display: flex; flex-direction: column; }

    .viewport-3d { flex: 1; background: var(--surface); position: relative; }
    #viewport-canvas { width: 100%; height: 100%; display: block; }
    .viewport-label {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      color: var(--text2);
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
    }
    .gizmo {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
    }

    .node-editor { flex: 1; background: var(--surface); }
    #node-canvas { width: 100%; height: 100%; }

    .asset-panel { flex: 1; display: flex; flex-direction: column; }
    .asset-toolbar {
      display: flex;
      gap: 4px;
      padding: 6px;
      border-bottom: 1px solid var(--border);
    }
    .asset-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px;
      padding: 8px;
      overflow-y: auto;
    }
    .asset-item {
      aspect-ratio: 1;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .asset-item:hover { transform: translateY(-2px); box-shadow: var(--glass-shadow); border-color: var(--accent); }
    .asset-item.selected { border-color: var(--accent); background: var(--surface2); }
    .asset-item .icon { font-size: 22px; margin-bottom: 4px; }
    .asset-item .name { font-size: 9px; color: var(--text2); text-align: center; }

    .timeline-panel { flex: 1; display: flex; flex-direction: column; }
    .timeline-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
    }
    .timeline-controls { display: flex; gap: 4px; }
    .timeline-track { flex: 1; background: var(--surface); overflow-x: auto; }
    #timeline-canvas { height: 100%; }

    .editor-area { flex: 1; display: flex; flex-direction: column; }
    .editor-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      height: 30px;
    }
    .editor-tab {
      padding: 6px 12px;
      cursor: pointer;
      font-size: 11px;
      color: var(--text2);
      border-right: 1px solid var(--border);
    }
    .editor-tab:hover { color: var(--text); }
    .editor-tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }

    .editor-content { flex: 1; }
    #code-editor {
      width: 100%;
      height: 100%;
      background: var(--surface);
      color: var(--text);
      border: none;
      padding: 12px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    .right-panel {
      width: 260px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .right-panel-header {
      padding: 6px 10px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }
    .right-panel-content { flex: 1; padding: 8px; overflow-y: auto; }

    .prop-group {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .prop-group h4 { font-size: 10px; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .prop-row { display: flex; align-items: center; margin-bottom: 4px; gap: 6px; }
    .prop-label { font-size: 11px; color: var(--text2); width: 20px; }
    .prop-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      color: var(--text);
      font-size: 11px;
      transition: border-color 0.15s;
    }
    .prop-input:focus { border-color: var(--accent); outline: none; }

    .ai-box {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
    }
    .ai-box h4 { font-size: 10px; margin-bottom: 8px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
    .ai-textarea {
      width: 100%;
      height: 60px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      color: var(--text);
      font-size: 11px;
      resize: none;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .ai-textarea:focus { border-color: var(--accent); outline: none; }
    .ai-btn {
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .ai-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .bottom-panel {
      height: 160px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .panel-tab {
      padding: 5px 12px;
      cursor: pointer;
      font-size: 10px;
      color: var(--text2);
    }
    .panel-tab:hover { color: var(--text); }
    .panel-tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }
    .panel-content {
      flex: 1;
      padding: 8px 10px;
      overflow-y: auto;
      font-family: 'Cascadia Code', monospace;
      font-size: 11px;
    }

    .status-bar {
      height: 20px;
      background: var(--accent);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 10px;
    }
    .status-left, .status-right { display: flex; gap: 12px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text2); }

    /* Selection */
    ::selection { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <div class="titlebar glass">
    <span>ZPX Studio</span>
    <div class="titlebar-center">
      <div class="theme-btn black" onclick="setTheme('black')" title="Black"></div>
      <div class="theme-btn white" onclick="setTheme('white')" title="White"></div>
      <div class="theme-btn glass" onclick="setTheme('glass')" title="Liquid Glass"></div>
    </div>
    <span id="project-name">No Project</span>
  </div>

  <div class="main">
    <div class="sidebar glass">
      <div class="sidebar-header">Explorer</div>
      <div class="sidebar-content">
        <ul class="file-tree" id="file-tree">
          <li class="active">main.zpx</li>
          <li>project.json</li>
          <li>assets/</li>
          <li>scenes/</li>
        </ul>
      </div>
    </div>

    <div class="center">
      <div class="toolbar glass">
        <button class="btn run" onclick="runGame()">Run</button>
        <button class="btn stop" onclick="stopGame()">Stop</button>
        <div class="sep"></div>
        <button class="btn ai" onclick="aiGenerate()">AI Generate</button>
        <button class="btn" onclick="formatCode()">Format</button>
        <button class="btn" onclick="checkSyntax()">Check</button>
        <div class="sep"></div>
        <button class="btn" onclick="exportGame()">Export</button>
      </div>

      <div class="viewport-area">
        <div class="viewport-tabs">
          <div class="viewport-tab active" onclick="switchViewport('3d')">3D Viewport</div>
          <div class="viewport-tab" onclick="switchViewport('nodes')">Visual Scripting</div>
          <div class="viewport-tab" onclick="switchViewport('assets')">Assets</div>
          <div class="viewport-tab" onclick="switchViewport('timeline')">Timeline</div>
          <div class="viewport-tab" onclick="switchViewport('code')">Code</div>
        </div>

        <div class="viewport-panel active" id="panel-3d">
          <div class="viewport-3d">
            <canvas id="viewport-canvas"></canvas>
            <div class="viewport-label">Perspective</div>
            <div class="gizmo"></div>
          </div>
        </div>

        <div class="viewport-panel" id="panel-nodes">
          <div class="node-editor">
            <canvas id="node-canvas"></canvas>
          </div>
        </div>

        <div class="viewport-panel" id="panel-assets">
          <div class="asset-panel">
            <div class="asset-toolbar">
              <button class="btn" onclick="importAsset()">Import</button>
              <button class="btn" onclick="createAsset()">New</button>
            </div>
            <div class="asset-grid" id="asset-grid"></div>
          </div>
        </div>

        <div class="viewport-panel" id="panel-timeline">
          <div class="timeline-panel">
            <div class="timeline-header">
              <div class="timeline-controls">
                <button class="btn" onclick="tlPrev()">Prev</button>
                <button class="btn run" onclick="tlPlay()">Play</button>
                <button class="btn stop" onclick="tlStop()">Stop</button>
                <button class="btn" onclick="tlNext()">Next</button>
              </div>
              <span style="font-size:11px" id="tl-frame">Frame: 0</span>
            </div>
            <div class="timeline-track">
              <canvas id="timeline-canvas"></canvas>
            </div>
          </div>
        </div>

        <div class="viewport-panel" id="panel-code">
          <div class="editor-area">
            <div class="editor-tabs">
              <div class="editor-tab active">main.zpx</div>
            </div>
            <div class="editor-content">
              <textarea id="code-editor" spellcheck="false">import "zap.zpx"

zap("My Game", 1280, 720)

player = zap_cube(0, 0, 0)
zap_color(player, 0.2, 0.6, 1.0)

ground = zap_plane(0, -1, 0)
zap_scale_to(ground, 20, 1, 20)
zap_color(ground, 0.3, 0.7, 0.3)

zap_on_update(fn(dt):
  if zap_key("w"): zap_move(player, 0, 0, -5 * dt)
  if zap_key("s"): zap_move(player, 0, 0, 5 * dt)
  if zap_key("a"): zap_move(player, -5 * dt, 0, 0)
  if zap_key("d"): zap_move(player, 5 * dt, 0, 0)
  let pos = zap_pos(player)
  zap_camera(pos[0], pos[1] + 5, pos[2] + 10)
end)

zap_run()
</textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-panel glass">
        <div class="panel-tabs">
          <div class="panel-tab active">Output</div>
          <div class="panel-tab">Problems</div>
          <div class="panel-tab">Console</div>
        </div>
        <div class="panel-content" id="output-panel"></div>
      </div>
    </div>

    <div class="right-panel glass">
      <div class="right-panel-header">Properties</div>
      <div class="right-panel-content">
        <div class="prop-group">
          <h4>Position</h4>
          <div class="prop-row"><span class="prop-label">X</span><input class="prop-input" type="number" value="0"></div>
          <div class="prop-row"><span class="prop-label">Y</span><input class="prop-input" type="number" value="0"></div>
          <div class="prop-row"><span class="prop-label">Z</span><input class="prop-input" type="number" value="0"></div>
        </div>
        <div class="prop-group">
          <h4>Scale</h4>
          <div class="prop-row"><span class="prop-label">X</span><input class="prop-input" type="number" value="1"></div>
          <div class="prop-row"><span class="prop-label">Y</span><input class="prop-input" type="number" value="1"></div>
          <div class="prop-row"><span class="prop-label">Z</span><input class="prop-input" type="number" value="1"></div>
        </div>
        <div class="prop-group">
          <h4>Color</h4>
          <div class="prop-row"><span class="prop-label">R</span><input class="prop-input" type="number" min="0" max="1" step="0.1" value="0.2"></div>
          <div class="prop-row"><span class="prop-label">G</span><input class="prop-input" type="number" min="0" max="1" step="0.1" value="0.6"></div>
          <div class="prop-row"><span class="prop-label">B</span><input class="prop-input" type="number" min="0" max="1" step="0.1" value="1.0"></div>
        </div>
        <div class="ai-box">
          <h4>AI Assistant</h4>
          <textarea class="ai-textarea" id="ai-input" placeholder="Describe your game..."></textarea>
          <button class="ai-btn" onclick="aiGenerate()">Generate</button>
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-left"><span id="status-msg">Ready</span><span>ZPX</span></div>
    <div class="status-right"><span id="status-cursor">Ln 1, Col 1</span><span>UTF-8</span></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const out = document.getElementById('output-panel');
    const editor = document.getElementById('code-editor');

    function log(msg) {
      const d = document.createElement('div');
      d.textContent = msg;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    function switchViewport(id) {
      document.querySelectorAll('.viewport-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.viewport-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('panel-' + id).classList.add('active');
      event.target.classList.add('active');
    }

    function runGame() { log('Running...'); ipcRenderer.invoke('run-game'); }
    function stopGame() { ipcRenderer.invoke('stop-game'); log('Stopped'); }
    function formatCode() { log('Formatted'); }
    function checkSyntax() { log('Syntax OK'); }
    function exportGame() { ipcRenderer.invoke('export-game', 'windows'); }

    function aiGenerate() {
      const p = document.getElementById('ai-input').value || 'A simple game';
      log('Generating: ' + p);
      ipcRenderer.invoke('ai-generate', p).then(code => {
        editor.value = code;
        log('Generated!');
      });
    }

    editor.addEventListener('keyup', () => {
      const pos = editor.selectionStart;
      const lines = editor.value.substring(0, pos).split('\n');
      document.getElementById('status-cursor').textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length+1}`;
    });

    editor.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = editor.selectionStart;
        editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(editor.selectionEnd);
        editor.selectionStart = editor.selectionEnd = s + 2;
      }
    });

    const assets = [
      { name: 'player.zpx', icon: '📦' },
      { name: 'enemy.zpx', icon: '📦' },
      { name: 'level1.zpx', icon: '📦' },
      { name: 'grass.png', icon: '🖼' },
      { name: 'jump.wav', icon: '🔊' },
      { name: 'run.anim', icon: '🎬' },
    ];

    function renderAssets() {
      const grid = document.getElementById('asset-grid');
      grid.innerHTML = '';
      assets.forEach(a => {
        const div = document.createElement('div');
        div.className = 'asset-item';
        div.innerHTML = `<div class="icon">${a.icon}</div><div class="name">${a.name}</div>`;
        div.onclick = () => {
          document.querySelectorAll('.asset-item').forEach(x => x.classList.remove('selected'));
          div.classList.toggle('selected');
        };
        grid.appendChild(div);
      });
    }
    renderAssets();

    function importAsset() { log('Import asset'); }
    function createAsset() { log('New asset'); }

    let tlFrame = 0;
    function tlPlay() { log('Playing'); }
    function tlStop() { tlFrame = 0; updateTL(); }
    function tlPrev() { tlFrame = Math.max(0, tlFrame - 1); updateTL(); }
    function tlNext() { tlFrame++; updateTL(); }
    function updateTL() { document.getElementById('tl-frame').textContent = 'Frame: ' + tlFrame; }

    const vc = document.getElementById('viewport-canvas');
    const vctx = vc.getContext('2d');
    function resizeViewport() {
      vc.width = vc.parentElement.clientWidth;
      vc.height = vc.parentElement.clientHeight;
      drawViewport();
    }
    function drawViewport() {
      const cs = getComputedStyle(document.documentElement);
      const bg = cs.getPropertyValue('--surface').trim();
      const accent = cs.getPropertyValue('--accent').trim();
      const border = cs.getPropertyValue('--border').trim();

      vctx.fillStyle = bg;
      vctx.fillRect(0, 0, vc.width, vc.height);

      vctx.strokeStyle = border;
      vctx.lineWidth = 0.5;
      const cx = vc.width / 2, cy = vc.height / 2;
      for (let i = -15; i <= 15; i++) {
        vctx.beginPath();
        vctx.moveTo(cx + i * 25, cy - 300);
        vctx.lineTo(cx + i * 25, cy + 100);
        vctx.stroke();
        vctx.beginPath();
        vctx.moveTo(cx - 375, cy + i * 25 + 100);
        vctx.lineTo(cx + 375, cy + i * 25 + 100);
        vctx.stroke();
      }

      vctx.fillStyle = accent;
      vctx.globalAlpha = 0.8;
      vctx.fillRect(cx - 15, cy - 15, 30, 30);
      vctx.globalAlpha = 0.4;
      vctx.fillRect(cx - 120, cy + 50, 240, 15);
      vctx.globalAlpha = 1;

      vctx.fillStyle = cs.getPropertyValue('--text2').trim();
      vctx.font = '10px sans-serif';
      vctx.fillText('Player', cx - 12, cy + 30);
      vctx.fillText('Ground', cx - 12, cy + 78);
    }
    window.addEventListener('resize', resizeViewport);
    setTimeout(resizeViewport, 100);

    const nc = document.getElementById('node-canvas');
    const nctx = nc.getContext('2d');
    const nodes = [
      { id: 1, x: 100, y: 80, w: 130, h: 50, title: 'On Update', color: '#fff' },
      { id: 2, x: 320, y: 60, w: 110, h: 45, title: 'Key "W"', color: '#888' },
      { id: 3, x: 320, y: 130, w: 130, h: 45, title: 'Move Player', color: '#888' },
      { id: 4, x: 540, y: 100, w: 110, h: 45, title: 'Camera', color: '#888' },
    ];
    const connections = [
      { from: 1, to: 3 },
      { from: 2, to: 3 },
      { from: 3, to: 4 },
    ];

    function resizeNodes() {
      nc.width = nc.parentElement.clientWidth;
      nc.height = nc.parentElement.clientHeight;
      drawNodes();
    }
    function drawNodes() {
      const cs = getComputedStyle(document.documentElement);
      nctx.fillStyle = cs.getPropertyValue('--surface').trim();
      nctx.fillRect(0, 0, nc.width, nc.height);

      nctx.fillStyle = cs.getPropertyValue('--border').trim();
      for (let x = 0; x < nc.width; x += 20) {
        for (let y = 0; y < nc.height; y += 20) {
          nctx.fillRect(x, y, 1, 1);
        }
      }

      nctx.strokeStyle = cs.getPropertyValue('--border').trim();
      nctx.lineWidth = 2;
      connections.forEach(c => {
        const fn = nodes.find(n => n.id === c.from);
        const tn = nodes.find(n => n.id === c.to);
        if (fn && tn) {
          nctx.beginPath();
          nctx.moveTo(fn.x + fn.w, fn.y + fn.h / 2);
          const cp = (tn.x - fn.x - fn.w) / 2;
          nctx.bezierCurveTo(fn.x + fn.w + cp, fn.y + fn.h / 2, tn.x - cp, tn.y + tn.h / 2, tn.x, tn.y + tn.h / 2);
          nctx.stroke();
        }
      });

      nodes.forEach(n => {
        nctx.fillStyle = cs.getPropertyValue('--glass').trim();
        nctx.fillRect(n.x, n.y, n.w, n.h);
        nctx.strokeStyle = cs.getPropertyValue('--glass-border').trim();
        nctx.lineWidth = 1;
        nctx.strokeRect(n.x, n.y, n.w, n.h);
        nctx.fillStyle = cs.getPropertyValue('--text').trim();
        nctx.font = '11px sans-serif';
        nctx.fillText(n.title, n.x + 8, n.y + 28);
      });
    }
    window.addEventListener('resize', resizeNodes);
    setTimeout(resizeNodes, 100);

    const tc = document.getElementById('timeline-canvas');
    const tctx = tc.getContext('2d');
    function resizeTimeline() {
      tc.width = tc.parentElement.clientWidth;
      tc.height = tc.parentElement.clientHeight;
      drawTimeline();
    }
    function drawTimeline() {
      const cs = getComputedStyle(document.documentElement);
      tctx.fillStyle = cs.getPropertyValue('--surface').trim();
      tctx.fillRect(0, 0, tc.width, tc.height);

      tctx.fillStyle = cs.getPropertyValue('--surface2').trim();
      tctx.fillRect(0, 0, tc.width, 24);

      tctx.fillStyle = cs.getPropertyValue('--text2').trim();
      tctx.font = '9px monospace';
      for (let i = 0; i < tc.width; i += 50) {
        tctx.fillText((i / 3).toFixed(0) + 'f', i + 2, 12);
        tctx.strokeStyle = cs.getPropertyValue('--border').trim();
        tctx.beginPath();
        tctx.moveTo(i, 20);
        tctx.lineTo(i, tc.height);
        tctx.stroke();
      }

      const tracks = [
        { name: 'Player', y: 30, keys: [0, 30, 60, 90] },
        { name: 'Camera', y: 58, keys: [0, 45, 90] },
        { name: 'Enemy', y: 86, keys: [15, 60] },
      ];
      tracks.forEach(tr => {
        tctx.fillStyle = cs.getPropertyValue('--glass').trim();
        tctx.fillRect(0, tr.y, tc.width, 26);
        tctx.fillStyle = cs.getPropertyValue('--text2').trim();
        tctx.font = '10px sans-serif';
        tctx.fillText(tr.name, 5, tr.y + 16);
        tctx.fillStyle = cs.getPropertyValue('--accent').trim();
        tr.keys.forEach(k => {
          tctx.beginPath();
          tctx.arc(k * 3 + 80, tr.y + 13, 4, 0, Math.PI * 2);
          tctx.fill();
        });
      });

      tctx.strokeStyle = cs.getPropertyValue('--accent').trim();
      tctx.lineWidth = 2;
      const px = tlFrame * 3 + 80;
      tctx.beginPath();
      tctx.moveTo(px, 0);
      tctx.lineTo(px, tc.height);
      tctx.stroke();
    }
    window.addEventListener('resize', resizeTimeline);
    setTimeout(resizeTimeline, 100);

    ipcRenderer.on('game-output', (e, d) => log(d));
    ipcRenderer.on('game-error', (e, d) => log('ERROR: ' + d));
    ipcRenderer.on('project-opened', (e, p) => {
      document.getElementById('project-name').textContent = p;
      log('Project: ' + p);
    });

    log('ZPX Studio ready');
  </script>
</body>
</html>
